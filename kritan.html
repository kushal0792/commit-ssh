<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Good Finds — Everyday Essentials</title>
	<style>
		:root{--green:#25634b;--ink:#1e2924;--muted:#69756e;--line:#e5e9e5;--cream:#f5f5ef}
		*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:1}.nav,main{max-width:1120px;margin:auto;padding-left:24px;padding-right:24px}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--ink);font-size:1.35rem;font-weight:800;letter-spacing:-.06em;text-decoration:none}.brand span{color:var(--green)}button,input{font:inherit}.cart{border:0;border-radius:99px;padding:10px 15px;background:var(--ink);color:white;cursor:pointer}.cart b{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;border-radius:50%;background:#d8eddf;color:var(--ink);font-size:.8rem}
		main{padding-top:32px;padding-bottom:64px}.hero{min-height:265px;padding:42px;border-radius:20px;background:linear-gradient(110deg,#e8f0e6,#f5ecdf);display:flex;align-items:center}.hero-copy{max-width:520px}.eyebrow{color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:10px 0;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.02;letter-spacing:-.06em}.hero p{max-width:430px;color:var(--muted);line-height:1.65}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:38px 0 18px}h2{margin:0;font-size:1.55rem;letter-spacing:-.04em}.search{width:260px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;outline-color:var(--green)}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:14px}.art{aspect-ratio:1/.8;display:grid;place-items:center;background:var(--bg);font-size:5rem}.details{padding:14px}.category{color:var(--muted);font-size:.78rem}.details h3{margin:5px 0 13px;font-size:1rem}.buy-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:750}.add{padding:9px 11px;border:0;border-radius:8px;background:var(--green);color:white;font-size:.84rem;font-weight:650;cursor:pointer}.add:hover{background:#194c38}.empty{grid-column:1/-1;text-align:center;padding:32px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:.9rem}
		@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.nav,main{padding-left:16px;padding-right:16px}main{padding-top:18px}.hero{min-height:220px;padding:25px}.section-head{align-items:stretch;flex-direction:column}.search{width:100%}.products{gap:10px}.art{font-size:4rem}.details{padding:11px}.add{padding:8px}}
	</style>
</head>
<body>
	<header><nav class="nav" aria-label="Main navigation"><a class="brand" href="#">good<span>finds</span></a><button class="cart" type="button" aria-label="Shopping cart">Cart <b id="cart-count">0</b></button></nav></header>
	<main>
		<section class="hero"><div class="hero-copy"><div class="eyebrow">Small things, better days</div><h1>Find your new favorite.</h1><p>Thoughtful everyday essentials, picked to bring a little more joy to your home and routine.</p></div></section>
		<section aria-labelledby="shop-heading"><div class="section-head"><h2 id="shop-heading">Shop our picks</h2><input class="search" id="search" type="search" placeholder="Search products..." aria-label="Search products"></div><div class="products" id="products"></div></section>
	</main>
	<footer>Good finds for everyday living · Free shipping on orders over $50</footer>
	<script>
		const products=[
			{name:'Ceramic Pour-Over',category:'Kitchen',price:28,icon:'☕',bg:'#eee2d5'},
			{name:'Everyday Tote',category:'Accessories',price:32,icon:'👜',bg:'#e6e9dc'},
			{name:'Soft Knit Throw',category:'Home',price:48,icon:'🧶',bg:'#f0e3e0'},
			{name:'Desk Plant',category:'Living',price:18,icon:'🪴',bg:'#e1eddf'},
			{name:'Travel Bottle',category:'Accessories',price:24,icon:'🧴',bg:'#e2eaf0'},
			{name:'Scented Candle',category:'Home',price:22,icon:'🕯️',bg:'#f2ead6'},
			{name:'Daily Notebook',category:'Stationery',price:14,icon:'📓',bg:'#e9e4f0'},
			{name:'Stoneware Bowl',category:'Kitchen',price:26,icon:'🥣',bg:'#f0e5db'}
		];
		const grid=document.getElementById('products');let count=0;
		function render(query=''){
			const found=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(query.toLowerCase()));
			grid.innerHTML=found.length?found.map(p=>`<article class="card"><div class="art" style="--bg:${p.bg}" aria-hidden="true">${p.icon}</div><div class="details"><div class="category">${p.category}</div><h3>${p.name}</h3><div class="buy-row"><span class="price">$${p.price.toFixed(2)}</span><button class="add" type="button">Add to cart</button></div></div></article>`).join(''):'<p class="empty">No products found. Try another search.</p>';
		}
		document.getElementById('search').addEventListener('input',e=>render(e.target.value));
		grid.addEventListener('click',e=>{if(!e.target.matches('.add'))return;document.getElementById('cart-count').textContent=++count;e.target.textContent='Added!';setTimeout(()=>{if(e.target.isConnected)e.target.textContent='Add to cart'},900)});
		render();
	</script>
</body>
</html>
